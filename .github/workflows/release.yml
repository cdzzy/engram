name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const p = JSON.parse(await readFile('./package.json', 'utf8')); process.stdout.write(p.version)")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi
          echo "Tag ${TAG_VERSION} matches package.json version."

      # Guard: only proceed when the NPM_TOKEN secret is configured.
      # (The secrets context is unavailable in step/job `if`, so the check
      # runs in a shell and exports an output flag consumed below.)
      - name: Check NPM_TOKEN secret
        id: token-guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret is not configured — skipping npm publish."
          else
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.token-guard.outputs.has-token == 'true'
        run: npm ci

      - name: Verify (lint + typecheck + test + build)
        if: steps.token-guard.outputs.has-token == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Publish to npm
        if: steps.token-guard.outputs.has-token == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
